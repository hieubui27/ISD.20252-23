<div class="page-container">
  <div class="top-bar">
    <h2 class="page-title">User Management</h2>
    <div class="search-container">
      <div class="search-input-wrapper">
        <svg class="search-icon" viewBox="0 0 14 14" fill="none">
          <path d="M13 13L9.8 9.8M11 6.5C11 9.04 8.98 11 6.5 11C4.02 11 2 9.04 2 6.5C2 3.96 4.02 2 6.5 2C8.98 2 11 3.96 11 6.5Z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <input type="text" placeholder="Search users..." (input)="onSearch($event)" />
      </div>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="header-section">
      <div class="title-area">
        <p class="subtitle">Administration</p>
        <h1 class="main-title">User Management</h1>
      </div>
      <div class="actions">
        <button class="btn-primary" routerLink="/manager/admin/users/new">+ Create New User</button>
      </div>
    </div>

    <div class="card">
      <table class="data-table">
        <thead>
          <tr>
            <th>Avatar</th>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users" (click)="goToProfile(user.id)" class="clickable-row">
            <td>
              <div class="avatar" [style.background-color]="getAvatarColor(user.userName)">
                {{ getInitials(user.userName) }}
              </div>
            </td>
            <td class="font-semibold">{{ user.userName }}</td>
            <td class="text-secondary">{{ user.email }}</td>
            <td class="text-secondary">{{ user.roles.join(', ') }}</td>
            <td>
              <span class="status-badge" [ngClass]="user.status === 'ACTIVE' ? 'status-active' : 'status-inactive'">
                {{ user.status === 'ACTIVE' ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td class="actions-cell">
              <button class="btn-text-primary" (click)="$event.stopPropagation(); goToProfile(user.id)">Edit</button>
              <button class="btn-text-danger" (click)="deleteUser(user.id, $event)">Delete</button>
            </td>
          </tr>
        </tbody>
      </table>

      <div class="pagination-wrapper" *ngIf="totalPages > 1">
        <app-aims-pagination 
          [currentPage]="filters.page" 
          [totalPages]="totalPages"
          [infoText]="'Showing ' + users.length + ' of ' + totalUsers + ' results'"
          (pageChange)="onPageChange($event)">
        </app-aims-pagination>
      </div>
    </div>
  </div>
</div>
