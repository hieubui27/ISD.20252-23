<div class="pagination">
  <p class="pagination-info" *ngIf="infoText">{{ infoText }}</p>
  <div class="pagination-controls" *ngIf="totalPages > 1">
    <button class="page-btn prev" [disabled]="currentPage === 1" (click)="onPrev()">
      <svg width="5" height="8" viewBox="0 0 5 8" fill="none"><path d="M4 1L1 4L4 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
    </button>
    <button 
      class="page-btn" 
      *ngFor="let page of pages" 
      [class.active]="page === currentPage"
      (click)="onPage(page)">
      {{ page }}
    </button>
    <button class="page-btn next" [disabled]="currentPage === totalPages" (click)="onNext()">
      <svg width="5" height="8" viewBox="0 0 5 8" fill="none"><path d="M1 1L4 4L1 7" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" /></svg>
    </button>
  </div>
</div>
