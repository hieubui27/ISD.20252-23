<button
  class="aims-button"
  [class.aims-button--primary]="variant === 'primary'"
  [class.aims-button--ghost]="variant === 'ghost'"
  [class.aims-button--secondary]="variant === 'secondary'"
  [class.aims-button--danger]="variant === 'danger'"
  [class.aims-button--full]="fullWidth"
  [class.aims-button--icon-only]="iconOnly"
  [class.aims-button--sm]="size === 'sm'"
  [class.aims-button--lg]="size === 'lg'"
  [type]="type"
  [disabled]="disabled || loading"
  (click)="onClick()"
>
  <span class="aims-button__content">
    <ng-content></ng-content>
  </span>
</button>
