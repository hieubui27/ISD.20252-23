<header class="aims-header">
  <div class="aims-header__inner">
    <button
      type="button"
      class="aims-header__menu-toggle"
      [class.aims-header__menu-toggle--open]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-label="Toggle navigation menu"
      (click)="toggleMenu()"
    >
      <svg viewBox="0 0 22 22" fill="none" aria-hidden="true">
        @if (menuOpen) {
        <path d="M4 4L18 18M18 4L4 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        } @else {
        <path d="M3 6H19M3 11H19M3 16H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        }
      </svg>
    </button>

    <button type="button" class="aims-header__brand" (click)="handleBrandClick()">AIMS</button>

    <form class="aims-header__search" *ngIf="showSearch" (submit)="$event.preventDefault(); onSearchSubmit()">
      <button type="submit" class="aims-header__search-icon" aria-label="Search">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M17 17L13.125 13.125M15.167 8.083C15.167 11.995 12.079 15.167 8.084 15.167C4.088 15.167 1 11.995 1 8.083C1 4.171 4.088 1 8.084 1C12.079 1 15.167 4.171 15.167 8.083Z" stroke="#414752" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </button>
      <input
        type="search"
        class="aims-header__search-input"
        placeholder="Search for books, CDs, DVDs..."
        aria-label="Search products"
        [value]="searchTerm"
        (input)="onSearchInput($any($event.target).value)"
      />
    </form>

    <nav class="aims-header__links" [class.aims-header__links--open]="menuOpen">
      <button type="button" class="aims-header__link aims-header__link--active" (click)="handleBrowseClick()">Browse</button>
      <button type="button" class="aims-header__link" (click)="closeMenu()">New Arrivals</button>
      <button type="button" class="aims-header__link" (click)="closeMenu()">Collections</button>
      <button type="button" class="aims-header__link" (click)="closeMenu()">Deals</button>
      <button type="button" class="aims-header__link aims-header__link--login" (click)="handleLoginClick()" title="Manager Login">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        Login
      </button>
    </nav>

    <div class="aims-header__cart-wrap">
      <button type="button" class="aims-header__cart-button" aria-label="Cart" (click)="handleCartClick()">
        <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
          <path d="M1 1H3.5L5.1 11.5C5.18 12.01 5.62 12.37 6.13 12.37H16.5C17.01 12.37 17.44 12.01 17.52 11.5L18.83 4H3.82M8 16.5C8 17.33 7.33 18 6.5 18C5.67 18 5 17.33 5 16.5C5 15.67 5.67 15 6.5 15C7.33 15 8 15.67 8 16.5ZM17 16.5C17 17.33 16.33 18 15.5 18C14.67 18 14 17.33 14 16.5C14 15.67 14.67 15 15.5 15C16.33 15 17 15.67 17 16.5Z" stroke="#1A1C1C" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>
    </div>
  </div>
</header>
