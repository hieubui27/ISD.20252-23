<div class="page-content">
  <div class="page-header">
    <div class="title-group">
      <p class="subtitle">Catalog</p>
      <h1 class="title">Product Overview</h1>
    </div>
    <div class="header-actions" *ngIf="authService.hasRole('Product Manager')">
      <app-aims-button variant="danger" *ngIf="logic.selectedIds.size > 0" (pressed)="logic.deleteSelected()">
        <app-aims-icon name="trash"></app-aims-icon>
        <span class="hide-text-mobile">Delete Selected</span>
      </app-aims-button>
      <app-aims-button variant="primary" (pressed)="logic.navigateToAddProduct()">
        <app-aims-icon name="plus"></app-aims-icon>
        <span class="hide-text-mobile">Add New Product</span>
      </app-aims-button>
    </div>
  </div>

  <div class="table-container">
    <table class="product-table">
      <thead>
        <tr>
          <th style="width: 40px">
            <input type="checkbox" (change)="logic.toggleAll($event)" />
          </th>
          <th>PRODUCT</th>
          <th class="hide-on-mobile">CATEGORY</th>
          <th>PRICE (VND)</th>
          <th class="hide-on-mobile">STOCK</th>
          <th class="hide-on-mobile">STATUS</th>
          <th>ACTIONS</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of (products$ | async) || []" (click)="logic.navigateToViewProduct(product.id)"
          style="cursor: pointer">
          <td (click)="$event.stopPropagation()">
            <input type="checkbox" [checked]="logic.isSelected(product.id)"
              (change)="logic.toggleSelection(product.id)" />
          </td>
          <td>
            <div class="product-info">
              <div class="image-wrapper">
                <img [src]="product.imageUrl || 'assets/default-product.png'" alt="" />
              </div>
              <div class="text-group">
                <span class="product-name">{{ product.title }}</span>
                <span class="product-id">#{{ product.id }}</span>
              </div>
            </div>
          </td>
          <td class="hide-on-mobile">{{ product.type }}</td>
          <td class="price">{{ product.currentPrice | number }}</td>
          <td class="hide-on-mobile">{{ product.stockQuantity }}</td>
          <td class="hide-on-mobile">
            <span class="status-badge" [ngClass]="product.status.toLowerCase()">{{ product.status }}</span>
          </td>
          <td class="actions-cell" (click)="$event.stopPropagation()">
            <button class="action-btn" *ngIf="authService.hasRole('Product Manager')"
              (click)="logic.navigateToEditProduct(product.id)">Edit</button>
          </td>
        </tr>

        <!-- Empty state or loading -->
        <tr *ngIf="(products$ | async)?.length === 0">
          <td colspan="7" class="empty-state">No products found.</td>
        </tr>
      </tbody>
    </table>

    <app-aims-pagination
      [currentPage]="(logic.currentPageSubject | async) || 1"
      [totalPages]="(logic.totalPages$ | async) || 1"
      (pageChange)="logic.changePage($event)">
    </app-aims-pagination>
  </div>
</div>
