<div class="manager-layout">
  <!-- Mobile Topbar -->
  <div class="mobile-topbar">
    <button class="hamburger-btn" (click)="toggleSidebar()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div class="mobile-brand">
      <span class="logo">AIMS</span>
    </div>
  </div>

  <!-- Sidebar Overlay -->
  <div class="sidebar-overlay" [class.open]="isSidebarOpen" (click)="closeSidebar()"></div>

  <aside class="sidebar" [class.open]="isSidebarOpen">
    <div class="sidebar-header">
      <span class="logo">AIMS</span>
      <span class="title">Product Manager</span>
      <span class="subtitle">Media Management</span>
    </div>

    <div class="sidebar-menu">
      <ng-container *ngIf="isAdmin$ | async; else managerMenu">
        <!-- Administrator Menu -->
        <a routerLink="/manager/dashboard" class="menu-item" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="1" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4" />
            <rect x="10" y="1" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4" />
            <rect x="1" y="10" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4" />
            <rect x="10" y="10" width="7" height="7" rx="1" stroke="currentColor" stroke-width="1.4" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/manager/admin/users" class="menu-item product-menu" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }" (click)="closeSidebar()">
          <div class="menu-inner">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle cx="9" cy="6" r="3" stroke="currentColor" stroke-width="1.4" />
              <path d="M2 16c0-3.87 3.13-7 7-7s7 3.13 7 7" stroke="currentColor" stroke-width="1.4"
                stroke-linecap="round" />
            </svg>
            <span>User Management</span>
          </div>
        </a>

        <a class="menu-item" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <rect x="2" y="2" width="14" height="14" rx="2" stroke="currentColor" stroke-width="1.4" />
            <path d="M5 6h8M5 9h6M5 12h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
          </svg>
          <span>System Logs</span>
        </a>
      </ng-container>

      <ng-template #managerMenu>
        <!-- Manager Menu -->
        <a routerLink="/manager/dashboard" class="menu-item" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1" />
            <rect width="7" height="5" x="14" y="3" rx="1" />
            <rect width="7" height="9" x="14" y="12" rx="1" />
            <rect width="7" height="5" x="3" y="16" rx="1" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/manager/products" class="menu-item product-menu" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
          <div class="menu-inner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="m7.5 4.27 9 5.15" />
              <path
                d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z" />
              <path d="m3.3 7 8.7 5 8.7-5" />
              <path d="M12 22V12" />
            </svg>
            <span>Product Management</span>
          </div>
        </a>

        <a routerLink="/manager/orders" class="menu-item order-menu" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
          <div class="menu-inner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1" />
              <circle cx="19" cy="21" r="1" />
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
            </svg>
            <span>Order Management</span>
          </div>
        </a>

        <a routerLink="/manager/refunds" class="menu-item" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: false }" (click)="closeSidebar()">
          <div class="menu-inner">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10" />
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
            </svg>
            <span>Refund Management</span>
          </div>
        </a>

        <a routerLink="/manager/products/history" class="menu-item" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" (click)="closeSidebar()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span>Product History</span>
        </a>
      </ng-template>
    </div>

    <div class="sidebar-footer">
      <a class="footer-item" (click)="logout()" style="cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" />
        </svg>
        <span>Logout</span>
      </a>
      <a class="footer-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
          <path d="M12 17h.01" />
        </svg>
        <span>Support</span>
      </a>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
